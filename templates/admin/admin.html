<!DOCTYPE html>

<html>

<head>

    <title>Admin Dashboard</title>
 
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<form method="GET" action="/admin">

    <input
        type="text"
        name="search"
        placeholder="Search by customer name">

    <button type="submit">
        Search
    </button>

</form>

<br>

<h1>Bookings</h1>

<a href="/logout">
    <button>Logout</button>
</a>

<a href="/admin/packages">
    <button>Manage Packages</button>
</a>

<br><br>


<table border="1">

<tr>

<th>ID</th>

<th>Package</th>

<th>Departure</th>

<th>Date</th>

<th>Name</th>

<th>Phone</th>

<th>Email</th>

<th>Status</th>

<th>Delete</th>

<th>Edit</th>

</tr>

{% for booking in bookings %}

<tr>

<td>{{ booking[0] }}</td>
<td>{{ booking[1] }}</td>
<td>{{ booking[2] }}</td>
<td>{{ booking[3] }}</td>
<td>{{ booking[4] }}</td>
<td>{{ booking[5] }}</td>
<td>{{ booking[6] }}</td>
<td>
    {{ booking[7] }}
    <br><br>

    <a href="/update_status/{{ booking[0] }}/Contacted">
        <button>Contacted</button>
    </a>

    <a href="/update_status/{{ booking[0] }}/Confirmed">
        <button>Confirmed</button>
    </a>

    <a href="/update_status/{{ booking[0] }}/Cancelled">
        <button>Cancelled</button>
    </a>

</td>

<td>
    <a href="/confirm_delete/{{ booking[0] }}">
        <button>Delete</button>
    </a>
</td>

<td>
    <a href="/edit_booking/{{ booking[0] }}">
        <button>Edit</button>
    </a>
</td>

</tr>

{% endfor %}

</table>

</body>

</html>
