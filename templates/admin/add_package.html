<!DOCTYPE html>
<html>

<head>

    <title>Add Package</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<h1>Add New Package</h1>

<form action="/add_package" method="POST">

    <label>Package Name</label><br>
    <input type="text" name="name" required><br><br>

    <label>Category</label><br>

    <select name="category" required>
        <option value="Umrah">Umrah</option>
        <option value="Hajj">Hajj</option>
    </select><br><br>

    <label>Hotel</label><br>
    <input type="text" name="hotel" required><br><br>

    <label>Duration</label><br>
    <input type="text" name="duration" required><br><br>

    <label>Transport</label><br>
    <input type="text" name="transport" required><br><br>

    <label>Visa</label><br>
    <input type="text" name="visa" required><br><br>

    <label>Price</label><br>
    <input type="text" name="price" required><br><br>

    <label>Image Filename</label><br>
    <input
        type="text"
        name="image"
        placeholder="example.jpg"
        required><br><br>

    <button type="submit">
        Save Package
    </button>

</form>

<br>

<a href="/admin/packages">
    <button>Cancel</button>
</a>

</body>

</html>
